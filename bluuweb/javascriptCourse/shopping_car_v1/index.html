<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart V1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="container my-5">
      <div id="cardsContainer" class="row"></div>
      <div id="ShoppingCart" class="row"></div>
    </div>

    <template id="cardTemplate">
      <div class="col-4 my-1">
        <section class="card d-flex justify-content-center align-items-center">
          <div class="card-body">
            <h4 class="card-title"></h4>
            <button class="btn btn-solid theme-primary w-100">Add</button>
          </div>
        </section>
      </div>
    </template>

    <template id="listTemplate">
      <div class="col-12 my-1">
        <section class="card">
          <div class="card-body">
            <h4
              class="card-title d-flex justify-content-between align-items-center"
            >
              <span class="badge theme-primary"></span>
            </h4>
          </div>
        </section>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
