<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color picker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container p-4 my-5">
      <div class="row">
        <div class="col-12">
          <div
            class="d-flex flex-column align-items-center justify-content-center gap-3 w-100"
          >
            <label for="colorInput" class="form-label">Choose your color</label>
            <input
              type="color"
              id="colorInput"
              class="form-control form-control-color w-100"
              value="#563d7c"
              title="Choose your color"
            />
            <button
              type="button"
              id="colorButton"
              class="btn btn-primary w-100"
            >
              Select color
            </button>
          </div>
          <div class="col-12 my-5">
            <div
              class="d-flex flex-column aling-items-center justify-content-center gap-3 w-100"
            >
              <p id="selectedColor" class="text-center">#563d7c</p>
              <div
                id="selectedColorCard"
                class="card p-5"
                style="background-color: #563d7c"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
